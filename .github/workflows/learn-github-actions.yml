name: learn-github-actions
run-name: ${{ github.actor }} is learning GitHub Actions
on: [push]
jobs:
  check-bats-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: shasum yarn.lock
      - run: yarn install
      - run: shasum yarn.lock
      - run: yarn upgrade
      - run: shasum yarn.lock
